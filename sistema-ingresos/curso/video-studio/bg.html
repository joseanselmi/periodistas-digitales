<!doctype html><html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#07070f; }
  .glow { position:absolute; border-radius:50%; filter:blur(120px); }
  .g1 { width:760px; height:760px; background:#6366f1; top:-240px; left:-160px; opacity:.5; }
  .g2 { width:680px; height:680px; background:#22d3ee; bottom:-280px; right:-140px; opacity:.32; }
  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px); background-size:70px 70px; }
</style></head><body>
  <div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
</body></html>
